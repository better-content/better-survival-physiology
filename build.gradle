plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-20230909.081143-1'
    id 'org.spongepowered.mixin' version '0.7.38'
}

mixin {
    add sourceSets.main, 'better_survival_physiology.refmap.json'
    config 'better_survival_physiology.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'better-survival-physiology'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Native bridge tests are nonshipping and run with the actual beverage provider and Diet.
sourceSets {
    nativeFixture {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def nativeRunDirectory = layout.buildDirectory.dir("gametest/${UUID.randomUUID()}").get().asFile

tasks.named('processNativeFixtureResources', ProcessResources) {
    // Same authored Create-6 Respite repairs as the provider's native fixture, never production resources.
    ['recipes/filling/water_cup.json', 'recipes/pouring/water_cup.json',
     'recipes/emptying/water_cup.json', 'loot_tables/blocks/kettle.json',
     'advancements/main/stunt_tea_bush.json'].each { relative ->
        from("../../better-content-modpack/kubejs/data/farmersrespite/${relative}") {
            into "data/farmersrespite/${relative.substring(0, relative.lastIndexOf('/'))}"
        }
    }
}

minecraft {
    mappings channel: 'parchment', version: parchment_mappings
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory nativeRunDirectory
            property 'forge.logging.console.level', 'info'
            property 'forge.enableGameTest', 'true'
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main; source sourceSets.nativeFixture } }
        }
    }
}

// File dependencies bypass FG remapping. Publish an immutable, content-addressed flatDir artifact.
def beverageOverride = providers.gradleProperty('drinkingWaterRuntimeJar').orNull
def stagedProviders = providers.environmentVariable('BC_CUSTOM_MOD_JAR_DIR').orNull
if (beverageOverride != null && beverageOverride.isBlank()) throw new GradleException('Blank drinkingWaterRuntimeJar')
if (stagedProviders != null && stagedProviders.isBlank()) throw new GradleException('Blank BC_CUSTOM_MOD_JAR_DIR')
if (beverageOverride == null && stagedProviders == null)
    throw new GradleException('Bind newly qualified Water via -PdrinkingWaterRuntimeJar=... or canonical BC_CUSTOM_MOD_JAR_DIR')
def beverageInput = file(beverageOverride != null ? beverageOverride :
        new File(stagedProviders, 'better-drinking-water-1.1.0.jar'))
if (!beverageInput.isFile()) throw new GradleException("Stage the beverage provider first: ${beverageInput}")
def beverageBytes = beverageInput.bytes
def beverageHash = java.security.MessageDigest.getInstance('SHA-256').digest(beverageBytes).encodeHex().toString()
// Outside buildDir: canonical `clean verifyFull` must not remove the already-resolved provider.
def beverageDirectory = file(".gradle/beverage-provider/${beverageHash}")
def beverageSnapshot = new File(beverageDirectory, "better-drinking-water-${beverageHash}.jar")
if (!beverageSnapshot.isFile()) {
    beverageDirectory.mkdirs()
    java.nio.file.Files.write(beverageSnapshot.toPath(), beverageBytes)
} else if (!java.util.Arrays.equals(beverageSnapshot.bytes, beverageBytes)) {
    throw new GradleException("Corrupted immutable beverage snapshot: ${beverageSnapshot}")
}
def beverageDependency = "bettercontent.beverage.local:better-drinking-water:${beverageHash}"

// Compilation of the optional Spice integration uses a content-addressed, separately
// source-tested provider; its JAR is NOT shipped inside physiology or copied to the pack.
// The canonical Water runtime remains the existing legacy binary above. New Water
// classes are an explicit compile-only snapshot, never a covert provider rollout.
def spicyOverride = providers.gradleProperty('spicyFarmersProviderJar').orNull
def typedWaterOverride = providers.gradleProperty('typedWaterCompileClasses').orNull
if (spicyOverride == null || spicyOverride.isBlank())
    throw new GradleException('Bind source-tested Spice provider via -PspicyFarmersProviderJar=...')
if (typedWaterOverride == null || typedWaterOverride.isBlank())
    throw new GradleException('Bind actual nonshipping Water API classes via -PtypedWaterCompileClasses=...')
def spicyInput = file(spicyOverride)
def typedWaterClasses = file(typedWaterOverride)
if (!spicyInput.isFile() || !typedWaterClasses.isDirectory()
        || !new File(typedWaterClasses, 'com/bettercontent/betterdrinkingwater/PlantDrinks.class').isFile()
        || !new File(typedWaterClasses, 'com/bettercontent/betterdrinkingwater/api/BeverageEvents.class').isFile())
    throw new GradleException('Missing explicit real Spice JAR or typed Water compile-only class snapshot')
def spicyBytes = spicyInput.bytes
def spicyHash = java.security.MessageDigest.getInstance('SHA-256').digest(spicyBytes).encodeHex().toString()
def spicyDirectory = file(".gradle/spice-provider/${spicyHash}")
def spicySnapshot = new File(spicyDirectory, "better-spicy-farmers-${spicyHash}.jar")
if (!spicySnapshot.isFile()) {
    spicyDirectory.mkdirs()
    java.nio.file.Files.write(spicySnapshot.toPath(), spicyBytes)
} else if (!java.util.Arrays.equals(spicySnapshot.bytes, spicyBytes)) {
    throw new GradleException("Corrupted immutable Spice snapshot: ${spicySnapshot}")
}
def spicyDependency = "bettercontent.spice.local:better-spicy-farmers:${spicyHash}"

repositories {
    flatDir { dirs beverageDirectory; content { includeGroup('bettercontent.beverage.local') } }
    flatDir { dirs spicyDirectory; content { includeGroup('bettercontent.spice.local') } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://maven.tterrag.com/' }
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.parchmentmc.org' }
}

// Raw pinned native bytecode is a declared test input, never a retained audit dump.
configurations { nativeEpicFight; nativeDiet; nativeColdSweat }

dependencies {
    nativeEpicFight('curse.maven:epic-fight-mod-405076:8049910') { transitive = false }
    nativeDiet('curse.maven:diet-443570:4813904') { transitive = false }
    nativeColdSweat('curse.maven:cold-sweat-506194:7893262') { transitive = false }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly fg.deobf(beverageDependency)
    runtimeOnly fg.deobf(beverageDependency)
    compileOnly files(typedWaterClasses)
    compileOnly fg.deobf(spicyDependency)
    // Gradle does not inherit main compileOnly into test/nativeFixture compile classpaths.
    // Explicitly bind identical providers; only the nonshipping fixture runtime gets Spice.
    testCompileOnly fg.deobf(spicyDependency)
    testRuntimeOnly fg.deobf(spicyDependency)
    nativeFixtureCompileOnly fg.deobf(spicyDependency)
    nativeFixtureCompileOnly fg.deobf(beverageDependency)
    nativeFixtureCompileOnly files(typedWaterClasses)
    nativeFixtureRuntimeOnly fg.deobf(spicyDependency)

    // Exact core native-provider fixture dependencies; no unrelated optional integrations.
    nativeFixtureCompileOnly fg.deobf('curse.maven:curios-api-309927:6418456')
    nativeFixtureCompileOnly fg.deobf('curse.maven:thirst-was-taken-679270:6660408')
    nativeFixtureCompileOnly fg.deobf('curse.maven:diet-443570:4813904')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:diet-443570:4813904')
    nativeFixtureRuntimeOnly fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')
    nativeFixtureRuntimeOnly fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92')
    nativeFixtureRuntimeOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    nativeFixtureRuntimeOnly fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:thirst-was-taken-679270:6660408')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:curios-api-309927:6418456')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:architectury-api-419699:5137938')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:farmers-delight-398521:8007609')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:farmers-respite-551453:5543547')
    nativeFixtureRuntimeOnly fg.deobf('curse.maven:brewin-and-chewin-637808:6237884')

    compileOnly fg.deobf('curse.maven:diet-443570:4813904')
    compileOnly fg.deobf('curse.maven:brewin-and-chewin-637808:6237884')
    compileOnly fg.deobf('curse.maven:thirst-was-taken-679270:6660408')
    compileOnly fg.deobf('curse.maven:epic-fight-mod-405076:8049910')
    compileOnly fg.deobf('curse.maven:cold-sweat-506194:7893262')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
}

processResources {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
// Mixin's annotation processor emits the refmap only when javac actually runs. Gradle's
// incremental no-source-changes path can remove it on a provider-classpath-only rebuild,
// silently staging a JAR with mixins but NO refmap. Recompile the production module on
// input changes and explicitly fingerprint the generated map as a task output.
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
}

test {
    useJUnitPlatform()
    inputs.files(configurations.nativeEpicFight, configurations.nativeDiet, configurations.nativeColdSweat)
    doFirst {
        systemProperty 'salience.nativeEpicFight', configurations.nativeEpicFight.singleFile.absolutePath
        systemProperty 'salience.nativeDiet', configurations.nativeDiet.singleFile.absolutePath
        systemProperty 'salience.nativeColdSweat', configurations.nativeColdSweat.singleFile.absolutePath
    }
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs deterministic unit and resource checks.'
    dependsOn tasks.named('check'), tasks.named('verifyNativeDiagnosticsRegression')
}

tasks.register('verifyNativeDiagnosticsRegression', Exec) {
    commandLine 'python3', '-B', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_native_*.py'
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Builds the runtime artifact after the deterministic checks.'
    dependsOn tasks.named('verifyFast'), tasks.named('stageRuntimeJar'), tasks.named('verifyNativeBeverages')
}

tasks.register('prepareNativeBeverages', Copy) {
    from('src/nativeFixture/resources/gameteststructures') { into 'gameteststructures' }
    from 'src/nativeFixture/server.properties'
    into nativeRunDirectory
}
tasks.matching { it.name.startsWith('prepareRunGameTestServer') }.configureEach {
    dependsOn tasks.named('prepareNativeBeverages'), tasks.named('nativeFixtureClasses')
}
tasks.register('verifyNativeBeverages') {
    group = 'verification'
    description = 'Runs the nonshipping Forge beverage/Diet/metabolism integration fixture.'
    dependsOn tasks.named('runGameTestServer')
    doLast {
        exec {
            commandLine 'python3', '-B', 'scripts/audit_native_diagnostics.py', '10',
                    new File(nativeRunDirectory, 'logs/latest.log').absolutePath,
                    new File(nativeRunDirectory, 'logs/debug.log').absolutePath
        }
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = uri("${project.projectDir}/repo") } }
}

apply from: 'gradle/native-compat-providers.gradle'
